name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_environment:
        description: 'Test environment'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - minimal
      run_type_check:
        description: 'Run mypy type checking'
        required: false
        default: true
        type: boolean
      run_lint:
        description: 'Run ruff linting'
        required: false
        default: true
        type: boolean
      python_version:
        description: 'Specific Python version to test (overrides matrix)'
        required: false
        default: ''
        type: string

jobs:
  test:
    strategy:
      matrix:
        python: ${{ fromJSON(github.event.inputs.python_version != '' && format('["{0}"]', github.event.inputs.python_version) || '["3.8", "3.9", "3.10", "3.11", "3.12"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=base81 -v
      - name: Type check
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_type_check == 'true' }}
        run: mypy base81
      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_type_check == 'true' }}
        run: ruff check base81 tests